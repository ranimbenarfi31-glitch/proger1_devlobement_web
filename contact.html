<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TastyBite - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand logo" href="index.html"><img src="images/Logo.png" alt="Logo TastyBite"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto nav-links">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
            <li class="nav-item"><a class="nav-link" href="order.html">Order</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="order">
      <div class="section-title">
        <h2>Contact <span>Us</span></h2>
        <p>We will be happy to answer you</p>
      </div>
      <form id="contactForm">
        <label for="nom">Name</label>
        <input type="text" id="nom" name="nom" placeholder="Your name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Subject">
        <label for="msg">Message</label>
        <textarea id="msg" name="message" rows="6" placeholder="Your message" required></textarea>
        <div class="d-flex justify-content-between">
          <button type="reset" class="btn btn-outline-light">Reset</button>
          <button type="submit" class="btn btn-gold">Send</button>
        </div>
      </form>
      <div id="message" class="mt-4"></div>
    </section>

    <section class="menu">
      <div class="container">
        <div class="row">
          <div class="col-12 col-lg-6 mb-4">
            <h2 class="group-title">Our location</h2>
            <iframe src="https://www.google.com/maps?q=Tunis&amp;output=embed" width="100%" height="350" style="border:0;" title="Our location"></iframe>
          </div>
          <div class="col-12 col-lg-6 mb-4">
            <h2 class="group-title">Presentation video</h2>
            <iframe width="100%" height="350" src="https://www.youtube.com/embed/VIDEO_ID" title="Presentation video" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <div class="container footer-content">
      <div class="footer-logo">
        <h2>Tasty<span>Bite</span></h2>
        <p>Good Food, Good Mood!</p>
      </div>
      <div class="contact-info">
        <h3>Contact</h3>
        <a href="tel:+21629023776">&#128222; 29023776</a>
        <a href="contact.html">Contact page</a>
      </div>
      <div class="social">
        <h3>Follow Us</h3>
        <a href="https://facebook.com" target="_blank">Facebook</a>
        <a href="https://instagram.com" target="_blank">Instagram</a>
        <a href="https://tiktok.com" target="_blank">TikTok</a>
      </div>
    </div>
    <p class="copyright">&copy; 2026 TastyBite. All Rights Reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="contact.js"></script>
</body>
</html>
