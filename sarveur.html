<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TastyBite - Order</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <h1>Tasty<span>Bite</span></h1>
      </div>
    </header>

    <section class="order">
      <div class="section-title">
        <h2>Complete Your <span>Order</span></h2>
        <p>Fill in your information below</p>
      </div>

      <form>
        <input type="text" placeholder="First Name" required />

        <input type="text" placeholder="Last Name" required />

        <input type="email" placeholder="Email Address" required />

        <input type="tel" placeholder="Phone Number" required />

        <label>Choose Your Food</label>

        <select id="foodSelect" required>
          <option value="">Select Food</option>
          <option value="Pizza">Pizza</option>
          <option value="Tacos">Tacos</option>
          <option value="Cake">Cake</option>
          <option value="Hamburger">Hamburger</option>
          <option value="Fried Chicken">Fried Chicken</option>
          <option value="Hot Dog">Hot Dog</option>
        </select>

        <label>Quantity</label>

        <input type="number" min="1" value="1" id="quantity" required />

        <input type="text" placeholder="Your Address" required />

        <input type="text" placeholder="Your City" required />

        <textarea placeholder="Additional Notes"></textarea>

        <h3 id="totalPrice">Total: $0.00</h3>

        <button type="submit">CONFIRM ORDER</button>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
